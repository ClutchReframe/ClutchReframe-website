<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
    <title id="title">ClutchReframe</title>
    <desc id="desc">ClutchReframe Clips and Live for Dota 2 — vertical content tools for highlights and live streams.</desc>
    <defs>
        <linearGradient id="brand" x1="74" y1="68" x2="714" y2="528" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00d9ff"/>
            <stop offset="1" stop-color="#a78bfa"/>
        </linearGradient>
        <linearGradient id="panel" x1="60" y1="40" x2="1140" y2="590" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0b111c"/>
            <stop offset="1" stop-color="#080712"/>
        </linearGradient>
        <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".025"/>
        </pattern>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="36"/>
        </filter>
    </defs>

    <rect width="1200" height="630" fill="#05050d"/>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <circle cx="270" cy="210" r="210" fill="#00d9ff" fill-opacity=".07" filter="url(#glow)"/>
    <circle cx="935" cy="440" r="230" fill="#7c3aed" fill-opacity=".08" filter="url(#glow)"/>
    <rect x="28" y="28" width="1144" height="574" rx="22" fill="url(#panel)" fill-opacity=".62" stroke="#00d9ff" stroke-opacity=".24"/>

    <g transform="translate(72 72)">
        <rect width="72" height="72" rx="18" fill="#05050d" stroke="url(#brand)" stroke-width="2"/>
        <path d="M24 26c0-4.4 3.6-8 8-8h20v9H34c-.6 0-1 .4-1 1v17c0 .6.4 1 1 1h18v9H32c-4.4 0-8-3.6-8-8V26Z" fill="url(#brand)"/>
        <path d="M39 32h20v9H39z" fill="#e2e8f0"/>
    </g>

    <text x="72" y="238" fill="url(#brand)" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-3">ClutchReframe</text>
    <text x="76" y="306" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400">Keep every fight in frame—after the match or live.</text>

    <line x1="76" y1="390" x2="1124" y2="390" stroke="#ffffff" stroke-opacity=".08"/>

    <text x="76" y="438" fill="#00d9ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">TWO DOTA 2 CREATOR WORKFLOWS</text>

    <rect x="76" y="464" width="500" height="92" rx="14" fill="#f5b94c" fill-opacity=".035" stroke="#f5b94c" stroke-opacity=".22"/>
    <circle cx="102" cy="493" r="5" fill="#f5b94c"/>
    <text x="118" y="499" fill="#ffd27a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">CLIPS</text>
    <text x="102" y="535" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Under Overwolf Review</text>

    <rect x="600" y="464" width="524" height="92" rx="14" fill="#00d9ff" fill-opacity=".035" stroke="#00d9ff" stroke-opacity=".22"/>
    <circle cx="626" cy="493" r="5" fill="#48c78e"/>
    <text x="642" y="499" fill="#57e8ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">LIVE</text>
    <text x="626" y="535" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Invite-Only Beta for OBS</text>
</svg>
